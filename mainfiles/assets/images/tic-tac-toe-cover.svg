<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Horse vs Rose Tic Tac Toe</title>
  <desc id="desc">A stylized portfolio cover for the Horse vs Rose Tic Tac Toe game.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe3d2"/>
      <stop offset="1" stop-color="#f8f2e8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="1" stop-color="#a52f49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5a3a22" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="36" fill="url(#bg)"/>
  <circle cx="150" cy="105" r="170" fill="#c89d68" opacity=".18"/>
  <circle cx="1060" cy="655" r="220" fill="#a52f49" opacity=".10"/>

  <g transform="translate(82 86)">
    <text x="0" y="0" dominant-baseline="hanging" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#76604a">CLASSIC STRATEGY GAME</text>
    <text x="0" y="66" dominant-baseline="hanging" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#2e2418">Horse</text>
    <text x="275" y="94" dominant-baseline="hanging" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" fill="#7a6048">vs</text>
    <text x="352" y="66" dominant-baseline="hanging" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#2e2418">Rose</text>
    <text x="0" y="180" dominant-baseline="hanging" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#6d5b49">Minimax AI · Match scoring · Local multiplayer</text>
  </g>

  <g transform="translate(682 102)" filter="url(#shadow)">
    <rect width="420" height="500" rx="34" fill="#fffaf2" stroke="#decdb7" stroke-width="3"/>
    <g transform="translate(48 48)">
      <g stroke="#d1bda4" stroke-width="8" stroke-linecap="round">
        <path d="M108 0 V324"/>
        <path d="M216 0 V324"/>
        <path d="M0 108 H324"/>
        <path d="M0 216 H324"/>
      </g>

      <g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
        <text x="54" y="82" font-size="72" fill="#8a5a2b">H</text>
        <text x="162" y="82" font-size="72" fill="#a52f49">R</text>
        <text x="270" y="82" font-size="72" fill="#8a5a2b">H</text>

        <text x="54" y="190" font-size="72" fill="#a52f49">R</text>
        <text x="162" y="190" font-size="72" fill="#8a5a2b">H</text>
        <text x="270" y="190" font-size="72" fill="#a52f49">R</text>

        <text x="54" y="298" font-size="72" fill="#8a5a2b">H</text>
        <text x="162" y="298" font-size="72" fill="#a52f49">R</text>
        <text x="270" y="298" font-size="72" fill="#8a5a2b">H</text>
      </g>
    </g>

    <rect x="48" y="408" width="324" height="52" rx="18" fill="url(#accent)"/>
    <text x="210" y="441" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">PLAY LIVE</text>
  </g>

  <g transform="translate(84 546)">
    <rect width="500" height="92" rx="26" fill="#fffaf2" stroke="#decdb7" stroke-width="2"/>
    <text x="28" y="31" dominant-baseline="hanging" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7a6048">FEATURES</text>
    <text x="28" y="58" dominant-baseline="hanging" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#2e2418">Easy · Medium · Hard · Best of 3 · Best of 5</text>
  </g>
</svg>